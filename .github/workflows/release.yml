name: Release Asset with Attestation

# Publication automatique : à chaque push sur main, la version lue dans
# manifest.json est publiée si elle n'a pas encore de tag. Le tag et la
# release sont créés ici même (un tag créé par le GITHUB_TOKEN ne déclenche
# pas d'autre workflow). On travaille sur dev ; main ne reçoit que des
# versions prêtes à sortir.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version and check for an existing tag
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $VERSION already exists: nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          # Titre et notes de la release : l'entrée de cette version dans CHANGELOG.md
          awk -v v="$VERSION" '
            index($0, "- **" v "** —") == 1 { on = 1; sub(/^- \*\*[^*]*\*\* — /, ""); print > "titre.txt"; next }
            on && /^- \*\*[0-9]/ { exit }
            on { sub(/^  /, ""); print }
          ' CHANGELOG.md > notes.md
          TITRE=$(cat titre.txt 2>/dev/null || true)
          echo "name=[$VERSION]${TITRE:+ — $TITRE}" >> "$GITHUB_OUTPUT"

      - name: Generate Artifact Attestation
        if: steps.version.outputs.exists == 'false'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            main.js
            manifest.json
            dictionnaire-base.json.gz

      - name: Create GitHub Release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.name }}
          body_path: notes.md
          files: |
            main.js
            manifest.json
            dictionnaire-base.json.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
